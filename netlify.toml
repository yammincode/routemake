[build]
  command = "npm run build"
  publish = ".next"
  # 只有 main 分支（正式版）才建置部署；開發分支推上來會被略過，不花 Netlify 額度
  ignore = "if [ \"$BRANCH\" = \"main\" ]; then exit 1; else exit 0; fi"

[build.environment]
  NODE_VERSION = "22"

# Service Worker 不能被快取，否則手機拿不到新版
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Content-Type = "application/javascript; charset=utf-8"
